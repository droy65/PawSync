services:
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
  web:
    build: .
    ports: ["5000:5000"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-ChangeMe@123}
    depends_on: [mongo]
volumes: {mongo_data: {}}
