<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAWSYNC - Smarter Matches. Happier Homes.</title>
<style>
:root{--bg:#fbf8f4;--card:#fff;--ink:#2b2622;--mut:#7a6f66;--pri:#e0662f;--pri2:#fde9de;--ok:#2f9e6b;--warn:#d9971a;--bad:#d64545;--line:#eadfd3}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#27221f;--ink:#f3ece5;--mut:#a89d93;--pri2:#3b2a20;--line:#3a332e}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav b{font-size:20px;margin-right:auto;cursor:pointer}nav b span{color:var(--pri)}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}button:hover{filter:brightness(.97)}
main{max-width:1150px;margin:0 auto;padding:20px}.hero{padding:48px 0 24px;text-align:center}.hero h1{font-size:clamp(30px,5vw,48px);margin:0 0 8px}.hero p{color:var(--mut);margin:0 0 20px}
.search{display:flex;gap:8px;max-width:680px;margin:0 auto}.search input{flex:1}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px #0001;cursor:pointer;transition:transform .15s}.card:hover{transform:translateY(-3px)}
.ph{height:130px;display:grid;place-items:center;font-size:56px;background:var(--pri2)}.cb{padding:14px}.cb h3{margin:0}.mut{color:var(--mut);font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--pri2);margin:2px 3px 0 0}.LOW,.Low{color:var(--ok)}.MEDIUM,.Medium{color:var(--warn)}.HIGH,.Critical{color:var(--bad)}.High{color:#e07b2f}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:50;padding:16px}.modal.on{display:grid}.box{background:var(--card);border-radius:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.fi{display:grid;grid-template-columns:130px 1fr 50px;gap:8px;align-items:center;font-size:13px;margin:5px 0}.pos i{background:var(--ok)}.neg i{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.kpi b{font-size:26px;display:block}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}td,th{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}.sc{overflow-x:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;display:none;z-index:99}
.sk{height:230px;border-radius:16px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200% 0}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tl{border-left:3px solid var(--pri);padding-left:12px;margin:8px 0}h2{margin:26px 0 10px}
#chat{position:fixed;right:16px;bottom:16px;z-index:30}#cw{display:none;width:min(340px,92vw);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}#cw.on{display:block}#cl{max-height:220px;overflow:auto;font-size:14px}
</style></head><body>
<nav><b onclick="go('home')">🐾 PAW<span>SYNC</span></b><span id="nv"></span></nav>
<main id="app"></main><div id="toast"></div>
<div class="modal" id="md"><div class="box" id="mb"></div></div>
<div id="chat"><div id="cw"><div id="cl"><p class="mut">Hi! Ask: “young female dog” or “senior cat”. I only show real data from the database.</p></div>
<div class="row" style="margin-top:8px"><input id="ci" style="flex:1" placeholder="Ask PAWSYNC AI"><button class="p" onclick="chat()">Send</button></div></div><button class="p" onclick="cw.classList.toggle('on')">🐾 PAWSYNC AI</button></div>
<script>
const $=s=>document.querySelector(s);let U=JSON.parse(localStorage.u||'null'),T=localStorage.t||null,F={},PG=1;
const api=async(p,o={})=>{const r=await fetch('/api'+p,{method:o.method||'GET',headers:{'Content-Type':'application/json',...(T?{Authorization:'Bearer '+T}:{})},body:o.body?JSON.stringify(o.body):undefined});const d=await r.json();if(!r.ok)throw new Error(d.message||d.msg||'Error');return d};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
const modal=h=>{$('#mb').innerHTML=h;$('#md').classList.add('on')};$('#md').onclick=e=>{if(e.target.id=='md')$('#md').classList.remove('on')};
const pct=x=>Math.round(x*100),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const age=m=>m<1?'<1 mo':m<24?Math.round(m)+' mo':(m/12).toFixed(1).replace('.0','')+' yrs';
const alt=p=>p.altered===true?'Spayed/neutered':p.altered===false?'Intact':'Status unknown';
function nav(){const l=[['home','Home'],['find','Find a Pet'],['insights','Data Insights']];if(U){l.push(['dash','Dashboard']);if(U.role=='adopter')l.push(['favs','Favorites'],['apps','Applications']);if(U.role=='shelter')l.push(['shelter','Shelter']);if(U.role=='admin')l.push(['admin','Admin'])}
$('#nv').innerHTML=l.map(([k,n])=>`<button onclick="go('${k}')">${n}</button>`).join(' ')+(U?` <button onclick="logout()">Logout (${esc(U.name.split(' ')[0])})</button>`:` <button class="p" onclick="authm()">Login / Sign up</button>`)}
function go(p){nav();({home,find,insights,dash,favs,apps,shelter,admin})[p]()}
function authm(reg){modal(`<h2>${reg?'Create account':'Welcome back'}</h2><div class="row" style="flex-direction:column;align-items:stretch">${reg?'<input id="an" placeholder="Name">':''}<input id="ae" placeholder="Email"><input id="ap" type="password" placeholder="Password (8+ chars)"><button class="p" onclick="auth(${!!reg})">${reg?'Sign up':'Login'}</button><button onclick="authm(${!reg})">${reg?'I have an account':'Create an account'}</button><p class="mut">Demo: demo@ / shelter@ / admin@pawsync.com — password is DEMO_PASSWORD from your .env</p></div>`)}
async function auth(reg){try{const d=await api(reg?'/auth/register':'/auth/login',{method:'POST',body:{name:$('#an')?.value,email:$('#ae').value,password:$('#ap').value}});T=d.token;U=d.user;localStorage.t=T;localStorage.u=JSON.stringify(U);$('#md').classList.remove('on');toast('Welcome, '+U.name);go('dash')}catch(e){toast(e.message)}}
function logout(){localStorage.clear();T=U=null;go('home')}
function petCard(p){const pr=p.prediction;return `<div class="card" onclick="detail('${p._id}')"><div class="ph">${p.species=='Dog'?'🐶':'🐱'}</div><div class="cb"><div class="row"><h3 style="flex:1">${esc(p.name)}</h3>${U?.role=='adopter'?`<button onclick="event.stopPropagation();fav('${p._id}',this)">♡</button>`:''}</div>
<div class="mut">${esc(p.breed)} · ${age(p.age_months)} · ${p.sex}</div><div><span class="badge">${esc(p.color)}</span><span class="badge">${alt(p)}</span>${p.match?`<span class="badge">${p.match}% match</span>`:''}</div>
<div class="mut" style="margin-top:8px">Adoption likelihood <b class="${pr.risk}">${pct(pr.probability)}%</b></div><div class="bar"><i style="width:${pct(pr.probability)}%"></i></div>${p.why?.length?`<div class="mut" style="margin-top:6px">${p.why.map(w=>'✓ '+esc(w)).join('<br>')}</div>`:''}</div></div>`}
async function fav(id,b){if(!U)return authm();try{const d=await api('/favorites/'+id,{method:'POST'});b.textContent=d.favorited?'♥':'♡';toast(d.favorited?'Saved to favorites':'Removed')}catch(e){toast(e.message)}}
async function detail(id){modal('<div class="sk"></div>');try{const p=await api('/pets/'+id),pr=p.prediction;
modal(`<div class="row"><div class="ph" style="width:90px;height:90px;border-radius:14px">${p.species=='Dog'?'🐶':'🐱'}</div><div><h2 style="margin:0">${esc(p.name)}</h2><div class="mut">${esc(p.breed)} · ${p.sex} · ${age(p.age_months)} · ${esc(p.color)}</div><div class="mut">${esc(p.shelter_name)} ${p.shelter_verified?'✔ Verified':'(Verification pending)'}</div></div></div>
<p>${esc(p.description)}</p><div><span class="badge">${alt(p)}</span><span class="badge">${p.species}</span><span class="badge">${p.views} views</span></div>
<h3>AI Adoption Insight</h3><p>${esc(p.insight)}</p><div class="kpis"><div class="kpi"><b class="${pr.risk}">${pct(pr.probability)}%</b>Adoption likelihood<br><span class="mut">Risk: ${pr.risk}</span></div><div class="kpi"><b>${pct(pr.baseline)}%</b>Shelter-wide average</div></div>
<div class="mut">What drives this (${pr.model}; effect vs. a typical animal)</div>${pr.factors.map(f=>`<div class="fi ${f.impact>=0?'pos':'neg'}"><span>${f.feature}</span><div class="bar"><i style="width:${Math.min(Math.abs(f.impact)*400,100)}%"></i></div><b>${f.impact>=0?'+':''}${pct(f.impact)}%</b></div>`).join('')}
<div class="row" style="margin-top:16px">${U?.role=='adopter'?`<button class="p" onclick="applyf('${p._id}')">Apply for adoption</button><button onclick="fav('${p._id}',this)">♡ Save</button>`:U?'':`<button class="p" onclick="authm()">Login to apply</button>`}<button onclick="$('#md').classList.remove('on')">Close</button></div>`)}catch(e){toast(e.message)}}
function applyf(id){modal(`<h2>Adoption application</h2><textarea id="ar" rows="4" style="width:100%" placeholder="Why are you a great match?"></textarea><div class="row" style="margin-top:10px"><button class="p" onclick="sendApp('${id}')">Submit</button></div>`)}
async function sendApp(id){const r=$('#ar').value;if(r.length<10)return toast('Please write at least 10 characters');try{await api('/applications',{method:'POST',body:{pet_id:id,reason:r}});$('#md').classList.remove('on');toast('Application submitted!');go('apps')}catch(e){toast(e.message)}}
const grid=(it,empty='No pets match your current filters.')=>it.length?`<div class="grid">${it.map(petCard).join('')}</div>`:`<p class="mut" style="text-align:center;padding:30px">${empty}<br><button onclick="F={};PG=1;find()">Clear Filters</button></p>`;
const bars=(o,fmt=v=>pct(v)+'%',mx=1)=>Object.entries(o).map(([k,v])=>`<div class="fi" style="grid-template-columns:120px 1fr 56px"><span>${esc(k)}</span><div class="bar"><i style="width:${Math.min(v/mx*100,100)}%"></i></div><b>${fmt(v)}</b></div>`).join('');
function chart(months,s){const W=560,H=200,all=[...s.actual,...s.forecast],mx=Math.max(...all)+s.ci,n=s.actual.length+s.forecast.length,x=i=>30+i*(W-40)/(n-1),y=v=>H-20-v/mx*(H-40);
const A=s.actual.map((v,i)=>`${x(i)},${y(v)}`).join(' '),k=s.actual.length-1,Fc=[s.actual[k],...s.forecast].map((v,i)=>`${x(k+i)},${y(v)}`).join(' '),band=s.forecast.map((v,i)=>`${x(k+1+i)},${y(v+s.ci)}`).join(' ')+' '+s.forecast.map((v,i)=>`${x(k+s.forecast.length-i)},${y(Math.max(s.forecast[s.forecast.length-1-i]-s.ci,0))}`).join(' ');
return `<svg viewBox="0 0 ${W} ${H}" style="width:100%"><polygon points="${band}" fill="var(--pri)" opacity=".18"/><polyline points="${A}" fill="none" stroke="var(--ink)" stroke-width="2"/><polyline points="${Fc}" fill="none" stroke="var(--pri)" stroke-width="2" stroke-dasharray="5"/><text x="30" y="14" fill="var(--mut)" font-size="11">max ${Math.round(mx)} adoptions/mo · solid=actual, dashed=forecast ±${s.ci}</text><text x="30" y="${H-4}" fill="var(--mut)" font-size="11">${months[0]}</text><text x="${W-60}" y="${H-4}" fill="var(--mut)" font-size="11">+3 months</text></svg>`}
function home(){$('#app').innerHTML=`<div class="hero"><h1>Find Your Perfect Companion</h1><p>Real animals from the Austin Animal Center — matched with intelligence.</p>
<div class="search"><input id="nl" placeholder="young female dog" onkeydown="event.key=='Enter'&&nls()"><button class="p" onclick="nls()">Ask PAWSYNC AI</button></div></div><div id="nlr"></div>
<h2>Pets waiting for a home</h2><div id="ft" class="grid">${'<div class="sk"></div>'.repeat(3)}</div><h2>How it works</h2><div class="kpis"><div class="kpi"><b>1</b>Search naturally</div><div class="kpi"><b>2</b>See the data-driven adoption likelihood</div><div class="kpi"><b>3</b>Apply &amp; track</div></div>`;
api('/pets?sort=views&limit=6').then(d=>$('#ft').outerHTML=grid(d.items))}
async function nls(){const q=$('#nl').value;if(!q)return;$('#nlr').innerHTML='<div class="sk"></div>';try{const d=await api('/ai/search',{method:'POST',body:{query:q}});$('#nlr').innerHTML=`<p><b>${esc(d.message)}</b> <span class="mut">Understood: ${Object.entries(d.filters).map(([k,v])=>k+'='+v).join(', ')||'no filters'}</span></p>`+grid(d.items)}catch(e){toast(e.message)}}
let dbt;function setF(k,v){F[k]=v;PG=1;clearTimeout(dbt);dbt=setTimeout(find,300)}
async function find(){const sel=(k,o)=>`<select onchange="setF('${k}',this.value)"><option value="">${k.replace('_',' ')}</option>${o.map(x=>`<option ${F[k]==x?'selected':''}>${x}</option>`).join('')}</select>`;
$('#app').innerHTML=`<h1>Find a Pet</h1><div class="filters">${sel('species',['Dog','Cat'])}${sel('sex',['Male','Female'])}${sel('age_group',['Young','Adult','Senior'])}<select onchange="setF('altered',this.value)"><option value="">neutered?</option><option value="1" ${F.altered?'selected':''}>Spayed/neutered only</option></select><input placeholder="Breed (e.g. Labrador)" value="${esc(F.breed||'')}" oninput="setF('breed',this.value)"><input placeholder="Name" value="${esc(F.q||'')}" oninput="setF('q',this.value)"><select onchange="setF('sort',this.value)"><option value="">Sort: Newest</option><option value="views">Most viewed</option><option value="youngest">Youngest</option><option value="oldest">Oldest</option></select><button onclick="F={};find()">Clear</button></div><div id="res" class="grid">${'<div class="sk"></div>'.repeat(6)}</div><div class="row" id="pgr" style="justify-content:center;margin:20px"></div>`;
try{const d=await api('/pets?'+new URLSearchParams({...F,page:PG,limit:12}));$('#res').outerHTML=`<div id="res">${grid(d.items)}</div>`;$('#pgr').innerHTML=`<button ${PG<=1?'disabled':''} onclick="PG--;find()">←</button> Page ${d.page}/${d.pages||1} (${d.total} pets) <button ${PG>=d.pages?'disabled':''} onclick="PG++;find()">→</button>`}catch(e){toast(e.message)}}
async function insights(){$('#app').innerHTML='<h1>Data insights</h1><div class="sk"></div>';try{const [f,a]=await Promise.all([api('/forecast'),api('/admin/stats',{}).catch(()=>null)]);
$('#app').innerHTML=`<h1>Adoption demand (real Austin data)</h1><p class="mut">${esc(f.note)}</p>${Object.entries(f.forecast).map(([sp,s])=>`<div class="card" style="padding:14px;margin:10px 0;cursor:default"><b>${sp}s</b> — next 3 months: ${s.forecast.join(', ')} adoptions (±${s.ci})${chart(f.months,s)}</div>`).join('')}`}catch(e){toast(e.message)}}
async function dash(){if(!U)return authm();if(U.role!='adopter')return go(U.role=='shelter'?'shelter':'admin');
$('#app').innerHTML=`<h1>Welcome back, ${esc(U.name.split(' ')[0])} 👋</h1><div class="sk"></div>`;try{const [r,n]=await Promise.all([api('/recommendations'),api('/notifications')]);
$('#app').innerHTML=`<h1>Welcome back, ${esc(U.name.split(' ')[0])} 👋</h1><h2>Recommended for you</h2><p class="mut">Based on your preferences, favorites and viewed pets. <a href="#" onclick="prefm();return false">Edit preferences</a></p>${grid(r.items)}<h2>Notifications</h2>${n.items.map(x=>`<div class="tl">${esc(x.message)}</div>`).join('')||'<p class="mut">Nothing yet.</p>'}`}catch(e){toast(e.message)}}
function prefm(){const p=U.preferences||{},o=(k,l)=>`<select id="pf_${k}"><option value="">${k}</option>${l.map(x=>`<option ${p[k]==x?'selected':''}>${x}</option>`).join('')}</select>`;modal(`<h2>Your preferences</h2><div class="row">${o('species',['Dog','Cat'])}${o('age_group',['Young','Adult','Senior'])}${o('sex',['Male','Female'])}<input id="pf_breed" placeholder="Breed" value="${esc(p.breed||'')}"></div><div class="row" style="margin-top:12px"><button class="p" onclick="savePref()">Save</button></div>`)}
async function savePref(){const b={};['species','age_group','sex','breed'].forEach(k=>{const v=$('#pf_'+k).value;if(v)b[k]=v});await api('/auth/preferences',{method:'PUT',body:b});U.preferences=b;localStorage.u=JSON.stringify(U);$('#md').classList.remove('on');toast('Saved');dash()}
async function favs(){const d=await api('/favorites');$('#app').innerHTML='<h1>Favorites</h1>'+grid(d.items,'No favorites yet.')}
async function apps(){const d=await api('/applications');$('#app').innerHTML='<h1>My applications</h1>'+(d.items.map(a=>`<div class="card" style="padding:14px;margin:10px 0;cursor:default"><b>${esc(a.pet_name)}</b> — <b class="${a.status=='Rejected'?'HIGH':'LOW'}">${a.status}</b>${a.history.map(h=>`<div class="tl mut">${h.status} · ${new Date(h.at).toLocaleString()}</div>`).join('')}</div>`).join('')||'<p class="mut">No applications yet.</p>')}
async function shelter(){const [a,ap]=await Promise.all([api('/shelter/analytics'),api('/applications')]);const k=(n,v)=>`<div class="kpi"><b>${v}</b>${n}</div>`,d=a.dataset;
$('#app').innerHTML=`<h1>${esc(a.shelter.name||'Shelter')}</h1><div class="kpis">${k('Available',a.by_status.Available||0)}${k('Adopted',a.by_status.Adopted||0)}${k('Applications',Object.values(a.applications).reduce((x,y)=>x+y,0))}${k('Avg adoption likelihood',pct(a.avg_probability)+'%')}${k('Critical',a.levels.Critical)}${k('High priority',a.levels.High)}</div>
<h2>AI shelter insights</h2>${a.insights.map(i=>`<div class="tl">${esc(i)}</div>`).join('')}<h2>Pets requiring attention</h2><div class="sc"><table><tr><th>Pet</th><th>Breed</th><th>Age</th><th>Likelihood</th><th>Priority</th></tr>${a.at_risk.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.breed)}</td><td>${age(r.age_months)}</td><td>${pct(r.probability)}%</td><td class="${r.level}"><b>${r.level}</b> (${r.score})</td></tr>`).join('')}</table></div>
<h2>Real outcome history (${d.records.toLocaleString()} records, ${d.date_range[0]} → ${d.date_range[1]})</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="kpi"><b style="font-size:16px">Outcomes</b>${bars(d.outcomes,v=>v.toLocaleString(),Math.max(...Object.values(d.outcomes)))}</div><div class="kpi"><b style="font-size:16px">Adoption rate by age</b>${bars(d.adoption_rate_by_age)}</div><div class="kpi"><b style="font-size:16px">By species</b>${bars(d.adoption_rate_by_species)}</div></div>
<h2>Applications</h2><div class="sc"><table><tr><th>Pet</th><th>Adopter</th><th>Status</th><th>Action</th></tr>${ap.items.slice(0,15).map(x=>`<tr><td>${esc(x.pet_name)}</td><td>${esc(x.adopter_name)}</td><td>${x.status}</td><td><select onchange="rev('${x._id}',this.value)"><option value="">Change…</option>${['Under Review','Interview','Approved','Rejected','Adopted'].map(s=>`<option>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan=4 class="mut">No applications yet.</td></tr>'}</table></div>
<h2>Add a pet</h2><div class="row"><input id="pn" placeholder="Name"><select id="ps"><option>Dog</option><option>Cat</option></select><input id="pb" placeholder="Breed"><input id="pa" type="number" placeholder="Age (months)"><select id="px"><option>Male</option><option>Female</option></select><select id="pt"><option value="true">Spayed/neutered</option><option value="false">Intact</option></select><button class="p" onclick="addPet()">Add</button></div>`}
async function rev(id,s){if(!s)return;try{await api('/applications/'+id,{method:'PUT',body:{status:s}});toast('Updated');shelter()}catch(e){toast(e.message)}}
async function addPet(){try{await api('/pets',{method:'POST',body:{name:$('#pn').value,species:$('#ps').value,breed:$('#pb').value,age_months:$('#pa').value,sex:$('#px').value,altered:$('#pt').value=='true'}});toast('Pet added');shelter()}catch(e){toast(e.message)}}
async function admin(){const d=await api('/admin/stats'),m=d.model;$('#app').innerHTML=`<h1>Platform overview</h1><div class="kpis">${['users','shelters','pets','applications','adoptions'].map(k=>`<div class="kpi"><b>${d[k]}</b>${k}</div>`).join('')}</div><h2>ML model monitoring</h2><p class="mut">Active: <b>${m.name}</b> · trained on ${m.training_records.toLocaleString()} real records, evaluated on the ${m.test_records.toLocaleString()} most recent · ${esc(m.source)}</p><div class="sc"><table><tr><th>Model</th>${Object.keys(m.metrics).map(k=>`<th>${k}</th>`).join('')}</tr>${Object.entries(m.all).map(([n,v])=>`<tr><td>${n==m.name?'★ ':''}${n}</td>${Object.values(v).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div><p class="mut">Predictions stored: ${m.predictions}</p>${m.metrics.roc_auc<.7?'<p class="HIGH">⚠ Model performance has dropped below the configured threshold.</p>':''}`}
async function chat(){const i=$('#ci'),q=i.value;if(!q)return;i.value='';$('#cl').innerHTML+=`<p><b>You:</b> ${esc(q)}</p>`;try{const d=await api('/ai/search',{method:'POST',body:{query:q}});$('#cl').innerHTML+=`<p><b>AI:</b> ${esc(d.message)}</p>`+d.items.slice(0,3).map(p=>`<p><a href="#" onclick="detail('${p._id}');return false">${esc(p.name)}</a> — ${esc(p.breed)}, ${age(p.age_months)}</p>`).join('')}catch(e){$('#cl').innerHTML+=`<p>${esc(e.message)}</p>`}$('#cl').scrollTop=1e5}
$('#ci').onkeydown=e=>e.key=='Enter'&&chat();go('home');
</script></body></html>
